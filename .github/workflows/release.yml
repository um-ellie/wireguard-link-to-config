name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tests
        run: |
          go test -v ./...
          python3 test_wireguard_link_to_config.py

      - name: Build Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          
          # Linux amd64 (Static)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/wireguard-link-to-config-linux-amd64 main.go parser.go
          
          # Windows amd64 (.exe)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/wireguard-link-to-config-windows-amd64.exe main.go parser.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/wireguard-link-to-config-linux-amd64
            dist/wireguard-link-to-config-windows-amd64.exe
